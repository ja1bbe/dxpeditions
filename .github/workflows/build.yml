name: DXペディション予定ページの更新

on:
  schedule:
    - cron: "20 5,17 * * *"   # 毎日 05:20 と 17:20 UTC（日本時間 14:20 と 2:20）
  workflow_dispatch:          # Actions の画面から手動でも実行できる

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ページを作る
        run: python build_adxo_page.py
      - name: 変更があれば保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "DXペディション予定を更新"
          git push
